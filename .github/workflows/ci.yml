name: CI

on:
  # Só na main (RIFA-072): o repositório é privado e cada rodada gasta minutos da cota do GitHub Actions. As branches
  # dos agentes passam pelo portão local (testes, lint, typecheck e build) antes do merge; numa branch, o CI roda
  # pelo Run workflow ou por um pull request.
  push:
    branches: [main]
  pull_request:
  # Publicar a main de novo sem commit (RIFA-035, D22): Actions → CI → Run workflow, na main. Refaz o build e a
  # publicação, como um push; noutra branch, só o job ci.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Na main não cancela: um push novo não pode interromper uma publicação no meio.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions fixadas pelo SHA do commit (a tag fica no comentário): uma tag pode ser movida para outro código,
# o SHA não. Para atualizar, troque o SHA e a tag juntos (git ls-remote --tags <repositório da action>).
jobs:
  # Sem segredo nenhum. Nos pushes da main, o build daqui é o que o job publicar publica (artefato, D18).
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo usa git depois do checkout: o GITHUB_TOKEN não fica gravado no .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Conferir o build para a publicação
        # O wrangler.json gerado tem de ser o do wrangler.jsonc (sem build.command, binding a mais ou outra pasta
        # de migrations) e o dist/ não pode ter .dev.vars nem .env. O job publicar confere de novo o que baixar.
        run: node scripts/conferir-artefato.mjs

      - name: Guardar o build para a publicação
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-producao
          # Só o dist/ (dist/client e dist/rifa_videira_kids): o artefato baixado só escreve dentro de dist/.
          path: dist/
          # O build tem dois arquivos ocultos (dist/client/.assetsignore, que o wrangler segue no upload dos
          # assets, e dist/rifa_videira_kids/.vite/manifest.json); a conferência acima barra .dev.vars e .env.
          include-hidden-files: true
          if-no-files-found: error
          # O publicar baixa o artefato do mesmo run, minutos depois. Para publicar de novo: Run workflow na main
          # (ou Re-run all jobs).
          retention-days: 1
          # No "Re-run all jobs" o build é refeito e substitui o artefato da tentativa anterior.
          overwrite: true

  publicar:
    name: publicar na Cloudflare
    needs: ci
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Sem `environment:` (revisão da RIFA-021, D18): o repositório é privado e, no plano Free do GitHub, ambientes
    # não estão disponíveis; o segredo é o do repositório. Para ligar o ambiente "producao" (GitHub Pro), veja a D18.
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    # Job separado (D18): nada aqui roda o npm ci com scripts de instalação nem o build. O que vem do job ci é só
    # o artefato do dist/, do mesmo run, conferido contra o wrangler.jsonc do checkout ANTES do token. O token
    # da Cloudflare só existe no ambiente do passo "Publicar", que aplica as migrations e publica esse dist/.
    # Conferido em src/worker/config-publicacao.test.ts.
    steps:
      - name: Conferir o segredo da Cloudflare
        id: segredo
        env:
          # Só "true" ou "false": o valor do segredo não entra neste passo.
          TEM_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$TEM_TOKEN" != "true" ]; then
            echo "::notice::Segredo CLOUDFLARE_API_TOKEN não configurado no repositório: publicação pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.segredo.outputs.ok == 'true'
        with:
          # O checkout traz o wrangler.jsonc, as migrations, o package-lock.json e o script de conferência.
          # O GITHUB_TOKEN não fica gravado no .git/config, ao alcance do wrangler.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.segredo.outputs.ok == 'true'
        with:
          # Sem cache: nada salvo por outro job (ou outra branch) entra neste.
          node-version: 22

      - name: Instalar as dependências sem os scripts de instalação
        if: steps.segredo.outputs.ok == 'true'
        # Versões e hashes do package-lock.json, sem nenhum script de instalação. Os binários do esbuild e do
        # workerd vêm dos pacotes de plataforma do lockfile (os scripts deles só conferem a instalação): o wrangler
        # roda o esbuild ao carregar; o workerd não roda no deploy nem nas migrations remotas (D18).
        run: npm ci --ignore-scripts

      - name: Baixar o build do job ci
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.segredo.outputs.ok == 'true'
        with:
          # Sem github-token nem run-id: só o artefato deste run, com o digest conferido no download.
          name: build-producao
          path: dist

      - name: Conferir o build baixado (sem o token)
        if: steps.segredo.outputs.ok == 'true'
        # Mesma conferência do job ci, agora contra o wrangler.jsonc do checkout; escreve o
        # .wrangler/deploy/config.json que o wrangler deploy segue (ele não vem no artefato).
        run: node scripts/conferir-artefato.mjs

      - name: Publicar (migrations no D1 remoto, deploy do que já foi construído)
        if: steps.segredo.outputs.ok == 'true'
        env:
          # Token de API da Cloudflare: segredo do repositório (docs/lancamento.md, 1.2).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4d8a1d1dae5b596e42e97dcf28292572
        # Não roda o Vite: o wrangler segue o .wrangler/deploy/config.json e publica dist/ como está (no_bundle).
        # O wrangler deploy --dry-run vem antes das migrations: sem o build, falha em segundos e o D1 fica intocado.
        run: npm run deploy:publicar

      - name: Conferir /api/health em produção
        if: steps.segredo.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://rifa-videira-kids.madruga.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          echo "::error::/api/health não respondeu 200 depois da publicação"
          exit 1
