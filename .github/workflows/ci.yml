name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Na main não cancela: um push novo não pode interromper uma publicação no meio.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: publicar na Cloudflare
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      # Token de API da Cloudflare: segredo do repositório (Settings > Secrets and variables > Actions).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 4d8a1d1dae5b596e42e97dcf28292572
    steps:
      - name: Conferir o segredo da Cloudflare
        id: segredo
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Segredo CLOUDFLARE_API_TOKEN não configurado no repositório: publicação pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.segredo.outputs.ok == 'true'

      - uses: actions/setup-node@v7
        if: steps.segredo.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.segredo.outputs.ok == 'true'

      - name: Publicar (build, migrations no D1 remoto, deploy)
        if: steps.segredo.outputs.ok == 'true'
        run: npm run deploy

      - name: Conferir /api/health em produção
        if: steps.segredo.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://rifa-videira-kids.madruga.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          echo "::error::/api/health não respondeu 200 depois da publicação"
          exit 1
