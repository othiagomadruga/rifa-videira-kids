name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Na main não cancela: um push novo não pode interromper uma publicação no meio.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Actions fixadas pelo SHA do commit (a tag fica no comentário): uma tag pode ser movida para outro código,
# o SHA não. Para atualizar, troque o SHA e a tag juntos (git ls-remote --tags <repositório da action>).
jobs:
  ci:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nenhum passo usa git depois do checkout: o GITHUB_TOKEN não fica gravado no .git/config.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: publicar na Cloudflare
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    # O token da Cloudflare NÃO fica no ambiente do job: só o passo "Publicar" o recebe, e ele só aplica as
    # migrations no D1 remoto e publica o que o passo "Construir" já gerou. Assim o checkout, o setup-node,
    # o npm ci (que roda os scripts de instalação do esbuild e do workerd) e o build (Vite e os plugins)
    # nunca o veem. Decisão D11 em docs/decisions.md; conferido em src/worker/config-publicacao.test.ts.
    steps:
      - name: Conferir o segredo da Cloudflare
        id: segredo
        env:
          # Só "true" ou "false": o valor do segredo não entra neste passo.
          TEM_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$TEM_TOKEN" != "true" ]; then
            echo "::notice::Segredo CLOUDFLARE_API_TOKEN não configurado no repositório: publicação pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.segredo.outputs.ok == 'true'
        with:
          # O GITHUB_TOKEN não fica gravado no .git/config, ao alcance do npm ci, do build e do wrangler.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.segredo.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.segredo.outputs.ok == 'true'

      - name: Construir o site e o Worker (sem o token)
        if: steps.segredo.outputs.ok == 'true'
        # Gera dist/client, dist/rifa_videira_kids e o .wrangler/deploy/config.json que o wrangler deploy segue.
        run: npm run build

      - name: Publicar (migrations no D1 remoto, deploy do que já foi construído)
        if: steps.segredo.outputs.ok == 'true'
        env:
          # Token de API da Cloudflare: segredo do repositório (Settings > Secrets and variables > Actions).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4d8a1d1dae5b596e42e97dcf28292572
        # Não roda o Vite: o wrangler segue o .wrangler/deploy/config.json e publica dist/ como está (no_bundle).
        run: npm run deploy:publicar

      - name: Conferir /api/health em produção
        if: steps.segredo.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://rifa-videira-kids.madruga.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          echo "::error::/api/health não respondeu 200 depois da publicação"
          exit 1
