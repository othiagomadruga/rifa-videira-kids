name: Voltar o site para a versão anterior

# RIFA-035 (D22): volta o código do site (o Worker na Cloudflare) para uma versão anterior, pelo celular:
# GitHub → Actions → "Voltar o site para a versão anterior" → Run workflow (docs/lancamento.md, 2.4 e 7.2).
# Não mexe no banco. Mesmo padrão endurecido do job publicar do ci.yml (D18): token só no passo que volta a
# versão, actions fixadas por SHA, npm ci sem scripts de instalação. Conferido em src/worker/config-publicacao.test.ts.
on:
  workflow_dispatch:
    inputs:
      motivo:
        description: "Motivo da volta, numa linha (até 120 caracteres; fica no histórico da Cloudflare)"
        required: true
        type: string
      versao:
        description: "Id da versão (vazio: a anterior à que está no ar)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

# Actions fixadas pelo SHA do commit, as mesmas do ci.yml (a tag fica no comentário).
jobs:
  voltar:
    name: voltar a versão na Cloudflare
    # Só a partir da main: rodado de outra branch, o job é pulado.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # O mesmo grupo do job publicar do ci.yml: uma volta e uma publicação nunca rodam ao mesmo tempo, e nenhuma
    # é cancelada no meio. Sem `environment:`, como o publicar (D18).
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    steps:
      - name: Conferir o segredo da Cloudflare
        id: segredo
        env:
          # Só "true" ou "false": o valor do segredo não entra neste passo.
          TEM_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ "$TEM_TOKEN" != "true" ]; then
            echo "::notice::Segredo CLOUDFLARE_API_TOKEN não configurado no repositório: volta da versão pulada."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.segredo.outputs.ok == 'true'
        with:
          # O checkout traz o wrangler.jsonc (o nome do Worker), o package-lock.json e o script da volta.
          # O GITHUB_TOKEN não fica gravado no .git/config, ao alcance do wrangler.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.segredo.outputs.ok == 'true'
        with:
          # Sem cache: nada salvo por outro job (ou outra branch) entra neste.
          node-version: 22

      - name: Instalar as dependências sem os scripts de instalação
        if: steps.segredo.outputs.ok == 'true'
        # Versões e hashes do package-lock.json, sem nenhum script de instalação (D18).
        run: npm ci --ignore-scripts

      - name: Voltar a versão (wrangler versions deploy, sem confirmar segredos trocados)
        if: steps.segredo.outputs.ok == 'true'
        env:
          # Token de API da Cloudflare: segredo do repositório (docs/lancamento.md, 1.2).
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4d8a1d1dae5b596e42e97dcf28292572
          # As entradas vão pelo ambiente, nunca escritas no script: o texto digitado não vira comando.
          MOTIVO: ${{ inputs.motivo }}
          VERSAO: ${{ inputs.versao }}
        # Não usa o `wrangler rollback`: no CI ele confirma sozinho a volta com segredos trocados (D22). O script
        # lista as publicações, escolhe a anterior (a mesma regra do rollback) ou a do id e roda o
        # `wrangler versions deploy <id>@100%`, que não força; se os segredos mudaram, termina com erro explicando.
        run: node scripts/voltar-versao.mjs

      - name: Conferir /api/health em produção
        if: steps.segredo.outputs.ok == 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://rifa-videira-kids.madruga.workers.dev/api/health; then exit 0; fi
            sleep 10
          done
          echo "::error::/api/health não respondeu 200 depois da volta da versão"
          exit 1
